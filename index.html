<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoGrip MR</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14110d; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* Palette and type: design/DESIGN.md */
      h1 {
        position: fixed; top: 18px; left: 24px; margin: 0; z-index: 1;
        font: 600 1.35rem/1 Georgia, serif; color: #f6efe2; pointer-events: none;
      }
      #xr-entry {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        font: 500 0.85rem/1.3 system-ui, sans-serif; color: #c9bba6;
      }
      #enter-mr {
        font: 600 1rem system-ui, sans-serif; padding: 12px 30px; border-radius: 999px; border: 0;
        background: #f6efe2; color: #1c1712; cursor: pointer; box-shadow: 0 6px 20px rgba(20, 12, 4, 0.35);
      }
      #enter-mr:disabled { opacity: 0.5; cursor: not-allowed; }
      #enter-note[hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1 id="title">ChronoGrip</h1>
    <div id="xr-entry">
      <button id="enter-mr" type="button" disabled>Enter MR</button>
      <span id="enter-note">Mixed reality needs a Quest browser. Drag to look around the tray.</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
