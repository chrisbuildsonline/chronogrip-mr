<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoGrip MR</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14110d; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      h1 {
        position: fixed; top: 16px; left: 24px; margin: 0; z-index: 1;
        font: 600 2rem/1 Georgia, serif; color: #e8c872; pointer-events: none;
      }
      #xr-entry {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        font: 0.95rem/1.3 Georgia, serif; color: #e8c872;
      }
      #enter-mr {
        font: 600 1.1rem Georgia, serif; padding: 10px 28px; border-radius: 8px;
        border: 2px solid #e8c872; background: #2a2118; color: #e8c872; cursor: pointer;
      }
      #enter-mr:disabled { opacity: 0.55; cursor: not-allowed; }
      #enter-note[hidden] { display: none; }
    </style>
  </head>
  <body>
    <h1 id="title">ChronoGrip</h1>
    <div id="xr-entry">
      <button id="enter-mr" type="button" disabled>Enter MR</button>
      <span id="enter-note">Mixed reality needs a Quest browser. Drag to look around the tray.</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
